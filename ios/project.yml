# Source of truth for ios/Mimamori.xcodeproj. Regenerate with `xcodegen generate --spec ios/project.yml`
# and commit both. Never hand-edit the .pbxproj.
name: Mimamori

options:
  bundleIdPrefix: com.sagochiko
  developmentLanguage: ja
  # The one place that sets the iOS version. 26.0 because AlarmKit needs it; lower it here once the
  # mother's iPhone model is known (#24).
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    DEVELOPMENT_TEAM: CTK4XXPWH9
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "8"
    # The screens are written in Japanese; without this, dates and system text fall back to English.
    DEVELOPMENT_LANGUAGE: ja
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  Core:
    path: Core

targets:
  Mimamori:
    type: application
    platform: iOS
    sources:
      # Includes App/Settings.bundle (Settings > みまもり: the daily prompt's switch and hour, #99),
      # which XcodeGen puts in the Resources phase by itself.
      - App
    dependencies:
      - package: Core
        product: MimamoriCore
      - target: MessageFilter
      - target: SafariExtension
      # Sends a shared screenshot or document to POST /consult and shows the answer (task 12, #13).
      - target: ShareExtension
      - target: CallDirectory
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.sagochiko.mimamori
        # App/Assets.xcassets/AppIcon holds a placeholder (one 1024 image) until the real icon is made.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        # Dev region (ja) value; ja.lproj and en.lproj InfoPlist.strings set the shown name per language.
        CFBundleDisplayName: みまもり
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [ja, en]
        MimamoriAPIBaseURL: https://$(MIMAMORI_API_HOST)
        # The judges' tour shows only when this is `demo` (MimamoriCore DemoMode, #100). The same token
        # is already in the Message Filter extension's URL, so no build carries anything new.
        MimamoriSMSFamilyToken: $(MIMAMORI_SMS_FAMILY_TOKEN)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        ITSAppUsesNonExemptEncryption: false
        # The voice consultation (task 12). Speech is turned into text on the iPhone; only the text is sent.
        # The smile camera (task 13). Face tracking judges the smile on the iPhone; only the photo taken
        # then goes to the family.
        NSCameraUsageDescription: 前のカメラに向かって笑ったときの写真を撮り、家族に届けるために使います。笑顔の判定は iPhone の中で行います。
        NSMicrophoneUsageDescription: マイクに話しかけた声で、スマホの困りごとや気になる電話の相談に答えるために使います。
        NSSpeechRecognitionUsageDescription: 話しかけた声を iPhone の中で文字にするために使います。声そのものは送りません。
    entitlements:
      path: App/Mimamori.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.sagochiko.mimamori
        com.apple.developer.associated-domains:
          - messagefilter:$(MIMAMORI_API_HOST)

  MessageFilter:
    type: app-extension
    platform: iOS
    sources:
      - MessageFilter
    dependencies:
      - package: Core
        product: MimamoriCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.sagochiko.mimamori.MessageFilter
    info:
      path: MessageFilter/Info.plist
      properties:
        CFBundleDisplayName: みまもり
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.identitylookup.message-filter
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessageFilterExtension
          # Where Apple sends the queries (Apple, "Creating a Message Filter App Extension"). The token
          # and the query come from build settings (ios/Config/Shared.xcconfig): `demo` unless a build
          # is made for the mother's family on purpose.
          NSExtensionAttributes:
            ILMessageFilterExtensionNetworkURL: https://$(MIMAMORI_API_HOST)/sms/$(MIMAMORI_SMS_FAMILY_TOKEN)$(MIMAMORI_SMS_QUERY)
    entitlements:
      path: MessageFilter/MessageFilter.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sagochiko.mimamori
        com.apple.developer.associated-domains:
          - messagefilter:$(MIMAMORI_API_HOST)

  SafariExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SafariExtension
        excludes:
          - Resources
      # Copied file by file into the bundle root, where Safari looks for manifest.json. A folder named
      # "Resources" at the top of an iOS bundle makes CFBundle read it as an old-style bundle and the
      # build fails with "Couldn't load Info dictionary".
      - path: SafariExtension/Resources
        buildPhase: resources
      # The same Keychain adapter as the app, reading the device key from the app group's access group.
      - path: App/KeychainDeviceKeyStore.swift
    dependencies:
      - package: Core
        product: MimamoriCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.sagochiko.mimamori.SafariExtension
    info:
      path: SafariExtension/Info.plist
      properties:
        CFBundleDisplayName: みまもり
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Where the native handler sends POST /page (same value as the app).
        MimamoriAPIBaseURL: https://$(MIMAMORI_API_HOST)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
    entitlements:
      path: SafariExtension/SafariExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sagochiko.mimamori

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      # The same Keychain adapter as the app, reading the device key from the app group's access group.
      - path: App/KeychainDeviceKeyStore.swift
    dependencies:
      - package: Core
        product: MimamoriCore
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.sagochiko.mimamori.ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: みまもり
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Where POST /consult goes (same value as the app).
        MimamoriAPIBaseURL: https://$(MIMAMORI_API_HOST)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Images only: text and links would show みまもり in their share sheets and send nothing.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sagochiko.mimamori

  # Tests of the app's own UIKit parts, run inside the app (the host). Launched with -mimamori-stub
  # (the scheme's test arguments), so the host never reaches the real backend.
  MimamoriTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: Mimamori
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.sagochiko.mimamori.AppTests
        GENERATE_INFOPLIST_FILE: YES

  CallDirectory:
    type: app-extension
    platform: iOS
    sources:
      - CallDirectory
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.sagochiko.mimamori.CallDirectory
    info:
      path: CallDirectory/Info.plist
      properties:
        CFBundleDisplayName: みまもり
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.callkit.call-directory
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CallDirectoryHandler
    entitlements:
      path: CallDirectory/CallDirectory.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.sagochiko.mimamori

schemes:
  Mimamori:
    build:
      targets:
        Mimamori: all
        # Built (so it keeps compiling) but not inside the app; see the note in Mimamori's dependencies.
        ShareExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MimamoriTests
      commandLineArguments:
        "-mimamori-stub": true
    archive:
      config: Release
